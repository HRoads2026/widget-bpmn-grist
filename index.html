<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Logigramme Grist</title>
    <script src="https://unpkg.com/bpmn-js@17.0.0/dist/bpmn-viewer.development.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #canvas { height: 100%; width: 100%; background-color: #fcfcfc; }
        #debug {
            position: fixed; bottom: 8px; left: 8px;
            background: rgba(0,0,0,0.65); color: #fff;
            font: 11px monospace; padding: 4px 8px;
            border-radius: 4px; z-index: 999;
            pointer-events: none;
        }

        #side-panel {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease-in-out;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }
        #side-panel.open { right: 0; }
        .close-btn {
            float: right;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            font-size: 18px;
        }
        .close-btn:hover { color: #333; }
        .field { margin-top: 20px; }
        .field-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        
        /* ✅ NOUVEAU : Style pour les champs de saisie */
        .field-input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .field-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>
    <div id="canvas"></div>
    <div id="debug">En attente de Grist…</div>

    <div id="side-panel">
        <span class="close-btn" onclick="document.getElementById('side-panel').classList.remove('open')">✕</span>
        <h2 id="panel-title">Détails</h2>
        
        <div class="field">
            <div class="field-label">Responsable</div>
            <input type="text" class="field-input" id="val-responsable">
        </div>
        <div class="field">
            <div class="field-label">Consulte</div>
            <input type="text" class="field-input" id="val-consulte">
        </div>
        <div class="field">
            <div class="field-label">Risque</div>
            <input type="text" class="field-input" id="val-risque">
        </div>
    </div>

    <script>
        const viewer = new BpmnJS({ container: '#canvas' });
        let gristRecords = [];
        let currentMappings = null; // ✅ Pour garder en mémoire les vrais noms des colonnes
        let currentRecordId = null; // ✅ Pour savoir quelle ligne on modifie
        const dbg = document.getElementById('debug');

        // ✅ Obligatoire pour l'écriture : requiredAccess DOIT être 'full'
        grist.ready({
            requiredAccess: 'full',
            allowSelectBy: true,
            columns: [
                { name: 'ID_BPMN', title: 'ID BPMN', type: 'Text' },
                { name: 'Responsable', title: 'Responsable', type: 'Text', optional: true },
                { name: 'Consulte', title: 'Consulte', type: 'Text', optional: true },
                { name: 'Risque', title: 'Risque', type: 'Text', optional: true }
            ]
        });

        // ✅ NOUVEAU : Met à jour les champs HTML sans déranger l'utilisateur s'il tape
        function updatePanelValues(match) {
            document.getElementById('panel-title').textContent = match.ID_BPMN;
            
            const fields = [
                { id: 'val-responsable', val: match.Responsable },
                { id: 'val-consulte', val: match.Consulte },
                { id: 'val-risque', val: match.Risque }
            ];

            fields.forEach(f => {
                const el = document.getElementById(f.id);
                // On met à jour la valeur SEULEMENT si l'utilisateur n'est pas actif dans ce champ
                if (document.activeElement !== el) {
                    el.value = f.val || "";
                }
            });
        }

        grist.onRecords(function(records, mappings) {
            currentMappings = mappings; // Sauvegarde des mappings
            gristRecords = records.map(r => ({
                id:          r.id,
                ID_BPMN:     mappings && mappings.ID_BPMN ? r[mappings.ID_BPMN] : r.ID_BPMN,
                Responsable: mappings && mappings.Responsable ? r[mappings.Responsable] : r.Responsable,
                Consulte:    mappings && mappings.Consulte ? r[mappings.Consulte] : r.Consulte,
                Risque:      mappings && mappings.Risque ? r[mappings.Risque] : r.Risque
            }));
            
            dbg.textContent = `✅ ${gristRecords.length} ligne(s) reçue(s) de Grist`;

            // Si le panneau est ouvert, on rafraîchit ses données (ex: modif externe sur Grist)
            if (currentRecordId) {
                const match = gristRecords.find(r => r.id === currentRecordId);
                if (match) updatePanelValues(match);
            }
        });

        // ✅ NOUVEAU : Fonction pour sauvegarder la saisie vers Grist
        async function saveToGrist(localName, elementId) {
            if (!currentRecordId) return;
            
            const newValue = document.getElementById(elementId).value;
            // Retrouver le "vrai" nom de la colonne Grist grâce aux mappings
            const realColName = currentMappings && currentMappings[localName] ? currentMappings[localName] : localName;
            
            try {
                // On récupère la table actuelle et on ordonne l'update
                const table = grist.getTable();
                await table.update({ id: currentRecordId, fields: { [realColName]: newValue } });
                dbg.textContent = `💾 Enregistré : ${localName}`;
            } catch (err) {
                dbg.textContent = `❌ Erreur sauvegarde : ${err.message}`;
                console.error(err);
            }
        }

        // ✅ NOUVEAU : Écoute les changements sur les champs de saisie
        // L'événement 'change' enregistre quand on clique en dehors du champ ou qu'on fait "Entrée"
        document.getElementById('val-responsable').addEventListener('change', () => saveToGrist('Responsable', 'val-responsable'));
        document.getElementById('val-consulte').addEventListener('change', () => saveToGrist('Consulte', 'val-consulte'));
        document.getElementById('val-risque').addEventListener('change', () => saveToGrist('Risque', 'val-risque'));

        // Chargement du BPMN
        const bpmnUrl = 'mon_logigramme.bpmn';

        fetch(bpmnUrl)
            .then(r => r.text())
            .then(xml => viewer.importXML(xml))
            .then(() => {
                viewer.get('canvas').zoom('fit-viewport');

                viewer.get('eventBus').on('element.click', function(e) {
                    const clickedId = e.element.id;
                    const match = gristRecords.find(r => r.ID_BPMN === clickedId);

                    if (match) {
                        dbg.textContent = `✅ Lien trouvé → rowId ${match.id}`;
                        grist.setSelectedRows([match.id]);

                        currentRecordId = match.id; // ✅ On mémorise la ligne
                        updatePanelValues(match);   // ✅ On remplit les inputs

                        document.getElementById('side-panel').classList.add('open');
                    } else {
                        dbg.textContent = `⚠️ Aucune ligne pour "${clickedId}"`;
                        document.getElementById('side-panel').classList.remove('open');
                        currentRecordId = null; 
                    }
                });
            })
            .catch(err => {
                dbg.textContent = '❌ Erreur BPMN : ' + err.message;
            });
    </script>
</body>
</html>
