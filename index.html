<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Grist BPMN Viewer</title>
    <script src="https://unpkg.com/bpmn-js@17.0.2/dist/bpmn-navigated-viewer.development.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body, html, #canvas { height: 100%; margin: 0; padding: 0; background: #f8f9fa; font-family: Arial, sans-serif; }
        
        #side-panel {
            position: fixed; top: 0; right: -350px; width: 320px; height: 100%;
            background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: 0.3s; padding: 20px; z-index: 100;
            box-sizing: border-box; overflow-y: auto;
        }
        #side-panel.open { right: 0; }
        
        .field-label { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; margin-top: 10px; display: block; }
        .field-input { width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; box-sizing: border-box; background: #fcfcfc; font-size: 13px; }
        h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 16px; }
        
        /* Bouton fermer optionnel */
        #close-btn { float: right; cursor: pointer; font-size: 20px; border: none; background: none; color: #aaa; }
    </style>
</head>
<body>
    <div id="canvas"></div>
    
    <div id="side-panel">
        <button id="close-btn">&times;</button>
        <h3 id="panel-title">Détails de la tâche</h3>
        
        <span class="field-label">Activité</span>
        <input type="text" id="val-activite" class="field-input" readonly>

        <span class="field-label">Composante concernée</span>
        <input type="text" id="val-composante" class="field-input" readonly>

        <span class="field-label">Titulaire de la tâche</span>
        <input type="text" id="val-titulaire" class="field-input" readonly>

        <span class="field-label">Périodicité</span>
        <input type="text" id="val-periodicite" class="field-input" readonly>

        <span class="field-label">Suppléant</span>
        <input type="text" id="val-suppleant" class="field-input" readonly>

        <span class="field-label">Contrôle 1er niveau</span>
        <input type="text" id="val-ctrl1" class="field-input" readonly>

        <span class="field-label">Contrôle hiérarchique</span>
        <input type="text" id="val-ctrlh" class="field-input" readonly>

        <span class="field-label">Outil / Application</span>
        <input type="text" id="val-outil" class="field-input" readonly>

        <span class="field-label">Fiches de procédure</span>
        <input type="text" id="val-procedure" class="field-input" readonly>

        <span class="field-label">Mode opératoire SIFAC</span>
        <input type="text" id="val-sifac" class="field-input" readonly>

        <span class="field-label">Textes / Réglementation</span>
        <input type="text" id="val-textes" class="field-input" readonly>

        <span class="field-label">Observations</span>
        <textarea id="val-observations" class="field-input" style="height: 80px;" readonly></textarea>
    </div>

    <script>
        const bpmnXML = `<?xml version="1.0" encoding="UTF-8"?>

      </bpmndi:BPMNShape>

        const viewer = new BpmnJS({ container: '#canvas' });
        let gristRecords = [];

        async function init() {
            try {
                await viewer.importXML(bpmnXML);
                viewer.get('canvas').zoom('fit-viewport');

                viewer.on('element.click', (e) => {
                    // On cherche la correspondance par l'ID de l'élément cliqué
                    const match = gristRecords.find(r => r.ID_BPMN === e.element.id);
                    
                    if (match) {
                        // Remplissage des champs
                        document.getElementById('val-activite').value = match.Activite_du_logigramme || "";
                        document.getElementById('val-composante').value = match.Composante_concernee || "";
                        document.getElementById('val-titulaire').value = match.Titulaire_de_la_tache || "";
                        document.getElementById('val-periodicite').value = match.Periodicite_de_la_tache || "";
                        document.getElementById('val-suppleant').value = match.Suppleant || "";
                        document.getElementById('val-ctrl1').value = match.Titulaire_charge_du_controle_de_1er_niveau || "";
                        document.getElementById('val-ctrlh').value = match.Titulaire_charge_du_controle_hierarchique || "";
                        document.getElementById('val-outil').value = match.Application_outil_utilise_pour_realiser_la_tache || "";
                        document.getElementById('val-procedure').value = match.Documentation_Fiches_de_procedure_associees || "";
                        document.getElementById('val-sifac').value = match.Mode_operatoire_SIFAC || "";
                        document.getElementById('val-textes').value = match.Textes_reglementation || "";
                        document.getElementById('val-observations').value = match.Observations || "";

                        // Ouverture du panneau
                        document.getElementById('side-panel').classList.add('open');
                        
                        // Optionnel : Sélectionne aussi la ligne dans le tableau Grist
                        grist.setSelectedRows([match.id]);
                    } else {
                        // Clic dans le vide : on ferme
                        document.getElementById('side-panel').classList.remove('open');
                    }
                });
            } catch (err) { console.error("Erreur BPMN:", err); }
        }

        // Fermeture manuelle via le bouton X
        document.getElementById('close-btn').onclick = function() {
            document.getElementById('side-panel').classList.remove('open');
        };

        grist.ready({ requiredAccess: 'full', allowSelectBy: true });

        grist.onRecords((records, mappings) => {
            // SECURITÉ : On vérifie si mappings existe pour éviter l'erreur "reading of null"
            gristRecords = records.map(r => {
                const getVal = (col) => {
                    const mappedName = (mappings && mappings[col]) ? mappings[col] : col;
                    return r[mappedName];
                };

                return {
                    id: r.id,
                    ID_BPMN: getVal('ID_BPMN'),
                    Activite_du_logigramme: getVal('Activite_du_logigramme'),
                    Composante_concernee: getVal('Composante_concernee'),
                    Titulaire_de_la_tache: getVal('Titulaire_de_la_tache'),
                    Periodicite_de_la_tache: getVal('Periodicite_de_la_tache'),
                    Suppleant: getVal('Suppleant'),
                    Titulaire_charge_du_controle_de_1er_niveau: getVal('Titulaire_charge_du_controle_de_1er_niveau'),
                    Titulaire_charge_du_controle_hierarchique: getVal('Titulaire_charge_du_controle_hierarchique'),
                    Application_outil_utilise_pour_realiser_la_tache: getVal('Application_outil_utilise_pour_realiser_la_tache'),
                    Documentation_Fiches_de_procedure_associees: getVal('Documentation_Fiches_de_procedure_associees'),
                    Mode_operatoire_SIFAC: getVal('Mode_operatoire_SIFAC'),
                    Textes_reglementation: getVal('Textes_reglementation'),
                    Observations: getVal('Observations')
                };
            });
            console.log("Données chargées :", gristRecords.length, "lignes.");
        });

        init();
    </script>
</body>
</html>
