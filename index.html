<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Logigramme Grist</title>
    <script src="https://unpkg.com/bpmn-js@17.0.0/dist/bpmn-viewer.development.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; }
        #canvas { height: 100%; width: 100%; background-color: #fcfcfc; }
        #debug {
            position: fixed; bottom: 8px; left: 8px;
            background: rgba(0,0,0,0.65); color: #fff;
            font: 11px monospace; padding: 4px 8px;
            border-radius: 4px; z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas"></div>
    <div id="debug">En attente de Grist…</div>

    <script>
        const viewer = new BpmnJS({ container: '#canvas' });
        let gristRecords = [];
        const dbg = document.getElementById('debug');

        // ✅ FIX 1 : déclarer la colonne ID_BPMN dans ready()
        grist.ready({
            requiredAccess: 'read table',
            allowSelectBy: true,
            columns: [
                { name: 'ID_BPMN', title: 'ID BPMN', type: 'Text' }
            ]
        });

        // ✅ FIX 2 : onRecords reçoit maintenant les données de Table1
        grist.onRecords(function(records, mappings) {
            // mappings permet de récupérer le bon nom de colonne même si renommée
            gristRecords = records.map(r => ({
                id:      r.id,
                ID_BPMN: mappings ? r[mappings.ID_BPMN] : r.ID_BPMN
            }));
            dbg.textContent = `✅ ${gristRecords.length} ligne(s) reçue(s) de Grist`;
            console.log('Grist records reçus :', gristRecords);
        });

        // Chargement du BPMN
        const bpmnUrl = 'mon_logigramme.bpmn';

        fetch(bpmnUrl)
            .then(r => r.text())
            .then(xml => viewer.importXML(xml))
            .then(() => {
                viewer.get('canvas').zoom('fit-viewport');

                viewer.get('eventBus').on('element.click', function(e) {
                    const clickedId = e.element.id;
                    dbg.textContent = `🖱️ Clic : "${clickedId}" — ${gristRecords.length} ligne(s) en mémoire`;

                    const match = gristRecords.find(r => r.ID_BPMN === clickedId);

                    if (match) {
                        dbg.textContent = `✅ Lien trouvé → rowId ${match.id}`;
                        grist.setSelectedRows([match.id]);
                    } else {
                        dbg.textContent = `⚠️ Aucune ligne pour "${clickedId}"`;
                        console.warn('IDs disponibles :', gristRecords.map(r => r.ID_BPMN));
                    }
                });
            })
            .catch(err => {
                dbg.textContent = '❌ Erreur BPMN : ' + err.message;
                console.error(err);
            });
    </script>
</body>
</html>
